<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Heavy Weather Survey</title>
<style>
:root{
  --bg:#f3f5f9; --card:#ffffff; --input:#ffffff; --ink:#14213d; --muted:#5b6678; --line:#d6dde8;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#e4ecf7; --head:#163a63;
  --sec-a:#7ea8d8; --sec-b:#cfe0f2; --sec-ink:#163a63; --hull:#eceff3; --hull-line:#4a5466;
  --ok:#1f7a4d; --err:#b3261e; --note:#fff5dc; --note-ink:#5a4300;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1420; --card:#152033; --input:#0f1828; --ink:#e6ecf5; --muted:#9aa7bb; --line:#2a3850;
    --accent:#5b9be0; --accent-ink:#081323; --accent-soft:#1c2d47; --head:#0a1a30;
    --sec-a:#3f6fa6; --sec-b:#22406a; --sec-ink:#e6ecf5; --hull:#2a3547; --hull-line:#b7c3d6;
    --ok:#5cc58d; --err:#ff8a80; --note:#2e2712; --note-ink:#f2dc9b;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1420; --card:#152033; --input:#0f1828; --ink:#e6ecf5; --muted:#9aa7bb; --line:#2a3850;
  --accent:#5b9be0; --accent-ink:#081323; --accent-soft:#1c2d47; --head:#0a1a30;
  --sec-a:#3f6fa6; --sec-b:#22406a; --sec-ink:#e6ecf5; --hull:#2a3547; --hull-line:#b7c3d6;
  --ok:#5cc58d; --err:#ff8a80; --note:#2e2712; --note-ink:#f2dc9b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.top{background:var(--head);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.top .in{max-width:780px;margin:0 auto;padding:10px 16px}
.top h1{font-size:1rem;margin:0;font-weight:650;letter-spacing:.01em}
.top .sub{font-size:.8rem;opacity:.8}
.steps{display:flex;gap:4px;margin-top:8px}
.steps i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
.steps i.on{background:#8fc1ff}
.wrap{max-width:780px;margin:0 auto;padding:8px 16px 40px}
h2{font-size:1.25rem;margin:18px 0 6px}
.lead{color:var(--muted);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.q{font-weight:650;margin:0 0 4px}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.sub{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.sub .q{font-weight:600;font-size:.95rem}
.note{background:var(--note);color:var(--note-ink);border-radius:10px;padding:10px 12px;font-size:.92rem;margin:8px 0 12px}
.note b{font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--input);cursor:pointer;user-select:none;text-align:center;line-height:1.2}
.chip span small{font-size:.74rem;color:var(--muted);margin-top:2px}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:checked + span small{color:var(--accent-ink);opacity:.85}
.chip input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.chip span:hover{border-color:var(--accent)}
.mrow{padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0;padding-top:4px}
.mrow .lbl{font-weight:600;margin-bottom:8px}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--input);border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:140px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px}
.field label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:3px}
.uin{display:flex;align-items:center;gap:6px}
.uin em{font-style:normal;color:var(--muted);font-size:.9rem;min-width:24px}
.other{margin-top:8px;max-width:320px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
table.g{width:100%;border-collapse:collapse;font-size:.92rem}
table.g th,table.g td{border:1px solid var(--line);padding:6px;text-align:center}
table.g th{background:var(--accent-soft);font-weight:600}
table.g td.rl{text-align:left;white-space:nowrap}
table.g td.rl small{display:block;color:var(--muted)}
table.g input{text-align:center;padding:8px 4px}
table.ss td,table.ss th{padding:5px 8px}
.figwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.figwrap svg{max-width:340px;width:100%;height:auto}
.legend{font-size:.92rem;margin:0;padding:0;list-style:none}
.legend li{padding:2px 0}
.legend b{display:inline-block;min-width:22px;color:var(--accent)}
.diag{display:grid;grid-template-columns:1fr;gap:4px;margin:6px 0 12px}
.diag svg{width:100%;max-width:360px;height:auto;justify-self:center}
.diag .cap{font-size:.86rem;color:var(--muted);text-align:center}
svg .t{fill:var(--muted);font:12px system-ui,sans-serif}
svg .tn{fill:var(--sec-ink);font:700 22px system-ui,sans-serif}
svg .ta{fill:var(--accent);font:600 13px system-ui,sans-serif}
svg .hull{fill:var(--hull);stroke:var(--hull-line);stroke-width:1.5}
svg .ghost{opacity:.28}
svg .ref{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1.2;fill:none}
svg .arc{stroke:var(--accent);stroke-width:2.5;fill:none}
svg .sea{stroke:var(--sec-a);stroke-width:2;fill:none}
.nav{display:flex;justify-content:space-between;gap:12px;margin:22px 0}
.btn{font:inherit;font-weight:650;border-radius:10px;padding:12px 20px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{margin-top:10px;font-size:.95rem}
.msg.err{color:var(--err)}
.msg.ok{color:var(--ok)}
.done{text-align:center;padding:40px 16px}
.done .big{font-size:2.6rem}
.demo{background:var(--note);color:var(--note-ink);font-size:.85rem;text-align:center;padding:6px 16px}
.hidden{display:none !important}
.admin table{font-size:.82rem}
.admin .scroll{overflow-x:auto;max-width:100%}
.kpi{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.kpi div{background:var(--accent-soft);border-radius:10px;padding:10px 14px;min-width:120px}
.kpi b{display:block;font-size:1.4rem}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
@media (max-width:480px){
  .chip span{padding:6px 10px}
  table.g{font-size:.84rem}
  table.g th,table.g td{padding:4px}
}
</style>
</head>
<body>
<div id="demoBar" class="demo hidden">Demo mode: the database is not connected yet, responses are saved only in this browser.</div>
<header class="top">
  <div class="in">
    <h1>Masters’ and Officers’ Experience in Heavy Weather</h1>
    <div class="sub" id="stepLabel">Anonymous questionnaire · about 10 minutes</div>
    <div class="steps" id="steps"></div>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
/* ===== Postavke: upiši adresu svog Supabase projekta i javni (anon / publishable) ključ ===== */
const SUPABASE_URL = 'https://qdzimszxuzkunbbzuxmh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_PYwX1e_TjtEQcDYPWnisEg_GWzrlZJH';
const SURVEY_VERSION = 'v1';
/* ========================================================================================== */

const DEMO = SUPABASE_URL.includes('YOUR-PROJECT');
const DRAFT_KEY = 'hw_survey_draft_' + SURVEY_VERSION;
const SENT_KEY = 'hw_survey_sent';
const DEMO_DB = 'hw_demo_responses';

const o = (v, l, sub) => ({ v, l, sub });
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const SEA = [
  o('4', '4', 'Hs 1.25–2.5 m'), o('5', '5', 'Hs 2.5–4 m'), o('6', '6', 'Hs 4–6 m'),
  o('7', '7', 'Hs 6–9 m'), o('8', '8', 'Hs 9–14 m'), o('9', '9', 'Hs > 14 m')
];
const SECTORS = ['head seas', 'bow quartering', 'beam seas', 'stern quartering', 'following seas'];
const EFFECTS = ['bow slamming', 'green water on deck', 'propeller emergence', 'rolling', 'pitching', 'accelerations on the bridge'];
const EFFECT_OPTS = EFFECTS.map((e, i) => o(String(i + 1), (i + 1) + ' ' + e));
const SECTOR_OPTS = SECTORS.map((s, i) => o(String(i + 1), (i + 1) + ' ' + s));

const ROLL_SVG = `<svg viewBox="0 0 280 182" role="img" aria-label="Roll angle is measured from upright to one side">
  <path class="sea" d="M10,128 q20,-8 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0"/>
  <line class="ref" x1="140" y1="122" x2="140" y2="22"/>
  <g transform="translate(140,122) rotate(-18)" class="ghost">
    <path class="hull" d="M-50,-10 L50,-10 L42,22 Q0,32 -42,22 Z"/><rect class="hull" x="-13" y="-40" width="26" height="30"/><line x1="0" y1="-40" x2="0" y2="-78" stroke="var(--hull-line)" stroke-width="2"/>
  </g>
  <g transform="translate(140,122) rotate(18)">
    <path class="hull" d="M-50,-10 L50,-10 L42,22 Q0,32 -42,22 Z"/><rect class="hull" x="-13" y="-40" width="26" height="30"/><line x1="0" y1="-40" x2="0" y2="-78" stroke="var(--hull-line)" stroke-width="2"/>
  </g>
  <path class="arc" d="M140,30 A92,92 0 0,1 168.4,34.5"/>
  <text class="ta" x="176" y="30">roll angle</text>
  <text class="t" x="14" y="176">faded = the roll to the other side (not added)</text>
</svg>`;

const PITCH_SVG = `<svg viewBox="0 0 340 175" role="img" aria-label="Pitch amplitude is measured from level trim to bow up or bow down">
  <path class="sea" d="M0,120 q20,-8 40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0 t40,0"/>
  <g transform="translate(130,95) rotate(10)" class="ghost">
    <path class="hull" d="M-90,-6 L76,-6 L96,-18 L88,10 L-84,10 Z"/><rect class="hull" x="-80" y="-26" width="22" height="20"/>
  </g>
  <g transform="translate(130,95) rotate(-10)">
    <path class="hull" d="M-90,-6 L76,-6 L96,-18 L88,10 L-84,10 Z"/><rect class="hull" x="-80" y="-26" width="22" height="20"/>
  </g>
  <line class="ref" x1="130" y1="95" x2="300" y2="95"/>
  <line class="ref" x1="130" y1="95" x2="290" y2="66.8"/>
  <path class="arc" d="M280,95 A150,150 0 0,0 277.7,69"/>
  <text class="ta" x="286" y="84">θ</text>
  <text class="ta" x="190" y="30">θ = pitch amplitude</text>
  <text class="t" x="190" y="46">bow up from level trim</text>
  <text class="t" x="14" y="166">faded = bow down (not added)</text>
</svg>`;

/* ===== Sadržaj ankete ===== */
const PAGES = [
  { id: 'intro', title: 'Introduction', items: [{ type: 'intro' }] },
  { id: 'p1', title: '1  About you and your ship', items: [
    { type: 'radio', key: 'q1_1_rank', q: '1.1  Your rank',
      opts: [o('master', 'Master'), o('chief_officer', 'Chief officer'), o('2nd_3rd_officer', '2nd / 3rd officer'), o('other', 'Other')],
      other: 'q1_1_rank_other' },
    { type: 'radio', key: 'q1_2_sea_service', q: '1.2  Sea service (years)',
      opts: [o('lt2', 'less than 2'), o('2-5', '2 – 5'), o('6-10', '6 – 10'), o('11-20', '11 – 20'), o('gt20', 'more than 20')] },
    { type: 'radio', key: 'q1_3_ship_type', q: '1.3  Type of your last ship', hint: 'All further questions refer to this ship.',
      opts: [o('container', 'Container ship'), o('bulk', 'Bulk carrier'), o('tanker', 'Tanker'), o('lng_lpg', 'LNG / LPG carrier'),
             o('general_cargo', 'General cargo'), o('roro_pax', 'Ro-Ro / passenger'), o('offshore', 'Offshore'), o('other', 'Other')],
      other: 'q1_3_ship_type_other' },
    { type: 'fields', q: '1.4  Main particulars of that ship', hint: 'As far as you know.', fields: [
      { key: 'q1_4_length_m', label: 'Length', unit: 'm' },
      { key: 'q1_4_breadth_m', label: 'Breadth', unit: 'm' },
      { key: 'q1_4_laden_draught_m', label: 'Laden draught', unit: 'm' },
      { key: 'q1_4_sea_speed_kn', label: 'Normal sea speed', unit: 'kn' },
      { key: 'q1_4_sea_speed_rpm', label: 'at', unit: 'rpm' }] },
    { type: 'radio', sub: true, key: 'q1_4_propeller', q: 'Propeller',
      opts: [o('fixed_pitch', 'Fixed pitch'), o('cpp', 'Controllable pitch (CPP)')] }
  ]},
  { id: 'p2', title: '2  Speed and course in heavy weather', items: [
    { type: 'grid21' },
    { type: 'effects' },
    ...[['head', 'HEAD', 1], ['beam', 'BEAM', 3], ['following', 'FOLLOWING', 5]].flatMap(([d, D, s], i) => {
      const n = i + 2, k = `q2_${n}_${d}`;
      const acting = a => a[k + '_sea_state'] && a[k + '_sea_state'] !== 'never';
      return [
        { type: 'radio', key: k + '_sea_state', q: `2.${n}  At what sea state do you first change speed / course in ${D} SEAS (sector ${s})?`,
          opts: [...SEA, o('never', 'never')] },
        { type: 'radio', sub: true, key: k + '_change', q: 'What do you change?', showIf: acting,
          opts: [o('speed', 'Speed'), o('course', 'Course'), o('both', 'Both')] },
        { type: 'radio', sub: true, key: k + '_main_effect', q: 'Main effect that makes you do it', showIf: acting, opts: EFFECT_OPTS }
      ];
    }),
    { type: 'radio', key: 'q2_5_ballast', q: '2.5  In ballast, compared with fully loaded, you are:',
      opts: [o('more', 'More cautious'), o('equal', 'Equally cautious'), o('less', 'Less cautious')] }
  ]},
  { id: 'p3', title: '3  Limits for individual effects', lead: 'Imagine the fully loaded ship from part 1. Choose one answer in each row.', items: [
    { type: 'matrix', q: '3.1  Bow slamming, green water and propeller emergence',
      hint: 'At what frequency of each event do you reduce speed, and at what frequency do you alter course? (number of events in 10 minutes)',
      cols: [o('1', '1', '≈ 1 in 10 min'), o('2', '2', '1 in 5 min'), o('3-4', '3 – 4', '1 in 2–3 min'), o('5-7', '5 – 7', '1 in 1.5–2 min'),
             o('8-10', '8 – 10', '≈ 1 per min'), o('gt10', '> 10', 'more often'), o('never', 'never', 'for this')],
      rows: [
        { key: 'q3_1_slamming_reduce_speed', label: '1  Bow slamming – reduce speed' },
        { key: 'q3_1_slamming_alter_course', label: '1  Bow slamming – alter course' },
        { key: 'q3_1_green_water_reduce_speed', label: '2  Green water – reduce speed' },
        { key: 'q3_1_green_water_alter_course', label: '2  Green water – alter course' },
        { key: 'q3_1_prop_emergence_reduce_speed', label: '3  Propeller emergence – reduce speed' },
        { key: 'q3_1_prop_emergence_alter_course', label: '3  Propeller emergence – alter course' }] },
    { type: 'matrix', q: '3.2  (4) Rolling',
      hint: 'At what roll angle do you reduce speed, and at what roll angle do you alter course?',
      note: '<b>Roll angle = heel to ONE side</b>, read on the inclinometer: from upright (0°) to the largest heel on one side. ' +
            'It is <b>not</b> the total swing from port to starboard. Example: rolling 15° to port and 15° to starboard → answer <b>15°</b> (not 30°). ' +
            'Take the largest rolls that keep recurring, not a single exceptional roll.',
      diagram: ROLL_SVG,
      cols: ['5', '10', '15', '20', '25', '30', '35'].map(v => o(v, v + '°')).concat([o('more', 'more')]),
      rows: [{ key: 'q3_2_roll_reduce_speed', label: 'Reduce speed at' }, { key: 'q3_2_roll_alter_course', label: 'Alter course at' }] },
    { type: 'matrix', q: '3.3  (5) Pitching',
      hint: 'At what pitch amplitude do you reduce speed, and at what amplitude do you alter course? If you have no indicator, give your best estimate.',
      note: '<b>Pitch amplitude = angle of the bow up OR down from level trim</b> (single amplitude). ' +
            'It is <b>not</b> peak-to-peak (bow-up to bow-down). Example: bow rises 4° and falls 4° → answer <b>4°</b> (not 8°). ' +
            'Give the amplitude at which you take action, i.e. the most pitching you still accept before you act.',
      diagram: PITCH_SVG,
      cols: ['2', '3', '4', '5', '6', '8'].map(v => o(v, v + '°')).concat([o('more', 'more'), o('cannot_estimate', 'cannot estimate')]),
      rows: [{ key: 'q3_3_pitch_reduce_speed', label: 'Reduce speed at' }, { key: 'q3_3_pitch_alter_course', label: 'Alter course at' }] },
    { type: 'matrix', q: '3.4  (6) Accelerations and motions on the bridge',
      hint: 'At which condition do you reduce speed, and at which do you alter course?',
      note: '<b>1</b> a standing person occasionally loses balance<br><b>2</b> a standing person must hold on all the time<br>' +
            '<b>3</b> hard to stand and work even when holding on<br><b>4</b> a seated person slides or falls off the seat',
      cols: [o('1', '1'), o('2', '2'), o('3', '3'), o('4', '4'), o('never', 'never', 'for this')],
      rows: [{ key: 'q3_4_bridge_reduce_speed', label: 'Reduce speed at' }, { key: 'q3_4_bridge_alter_course', label: 'Alter course at' }] },
    { type: 'effect35' }
  ]},
  { id: 'p4', title: '4  Your most recent such situation',
    lead: 'Think of the most recent case when speed was reduced or course altered because of heavy weather.', items: [
    { type: 'check', key: 'q4_no_experience', label: 'I have no such experience – skip to part 5' },
    ...[
      { type: 'radio', key: 'q4_1_sea_state', q: '4.1  Sea state', opts: SEA },
      { type: 'radio', key: 'q4_2_wave_direction', q: '4.2  Wave direction', opts: SECTOR_OPTS },
      { type: 'radio', key: 'q4_3_loading', q: '4.3  Loading condition',
        opts: [o('full', 'Fully loaded'), o('partly', 'Partly loaded'), o('ballast', 'In ballast')] },
      { type: 'radio', key: 'q4_4_main_reason', q: '4.4  Which effect was the main reason for your decision?',
        opts: [o('slamming', 'Bow slamming'), o('green_water', 'Green water'), o('prop_emergence', 'Propeller emergence'), o('rolling', 'Rolling'),
               o('pitching', 'Pitching'), o('accelerations', 'Accelerations'), o('cargo_risk', 'Risk to cargo'), o('other', 'Other')],
        other: 'q4_4_main_reason_other' },
      { type: 'fields', q: '4.5  What did you do?', fields: [
        { key: 'q4_5_speed_before_kn', label: 'Speed before', unit: 'kn' },
        { key: 'q4_5_speed_before_rpm', label: '(rpm)', unit: 'rpm' },
        { key: 'q4_5_speed_after_kn', label: 'Speed after', unit: 'kn' },
        { key: 'q4_5_speed_after_rpm', label: '(rpm)', unit: 'rpm' }] },
      { type: 'radio', sub: true, key: 'q4_5_course', q: 'Course', opts: [o('not_altered', 'Not altered'), o('altered', 'Altered')] },
      { type: 'fields', sub: true, q: 'Altered by', showIf: a => a.q4_5_course === 'altered',
        fields: [{ key: 'q4_5_altered_by_deg', label: 'Alteration', unit: '°' }] },
      { type: 'radio', sub: true, key: 'q4_5_new_wave_direction', q: '… so that the waves came from sector', showIf: a => a.q4_5_course === 'altered',
        opts: SECTOR_OPTS }
    ].map(it => Object.assign(it, { showIf: and(it.showIf, a => a.q4_no_experience !== 'yes') }))
  ]},
  { id: 'p5', title: '5  Comments', items: [
    { type: 'text', key: 'q5_comments', q: 'Anything you would like to add', hint: 'Optional. Please do not write names of persons, ships or companies.' },
    { type: 'submit' }
  ]}
];
function and(f, g) { return f ? a => f(a) && g(a) : g; }

/* ===== Stanje ===== */
let A = {};
try { A = JSON.parse(store.get(DRAFT_KEY) || '{}') || {}; } catch (e) { A = {}; }
let page = 0;
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const save = () => store.set(DRAFT_KEY, JSON.stringify(A));

/* Popis svih ključeva redom (stupci CSV-a) */
function itemKeys(it) {
  switch (it.type) {
    case 'radio': return it.other ? [it.key, it.other] : [it.key];
    case 'fields': return it.fields.map(f => f.key);
    case 'matrix': return it.rows.map(r => r.key);
    case 'grid21': return ['q2_1_unit', ...G21_ROWS.flatMap(r => G21_COLS.map(c => `q2_1_ss${r}_${c[0]}`))];
    case 'effect35': return EFFECTS.flatMap((e, i) => [`q3_5_e${i + 1}_speed_kn`, `q3_5_e${i + 1}_waves_after`]);
    case 'check': case 'text': return [it.key];
    default: return [];
  }
}
const G21_ROWS = ['5', '6', '7', '8'];
const G21_COLS = [['head', '1 head seas'], ['beam', '3 beam seas'], ['following', '5 following seas']];
const ALL_KEYS = PAGES.flatMap(p => p.items.flatMap(itemKeys));

/* ===== Crtanje ===== */
function chips(name, opts) {
  return `<div class="chips" role="radiogroup">` + opts.map(op =>
    `<label class="chip"><input type="radio" name="${name}" value="${esc(op.v)}"><span>${esc(op.l)}${op.sub ? `<small>${esc(op.sub)}</small>` : ''}</span></label>`
  ).join('') + `</div>`;
}
function textInput(key, unit, label) {
  return `<div class="field">${label ? `<label for="f_${key}">${esc(label)}</label>` : ''}<div class="uin"><input type="text" inputmode="decimal" id="f_${key}" name="${key}" autocomplete="off">${unit ? `<em>${esc(unit)}</em>` : ''}</div></div>`;
}

function waveFigure() {
  const cx = 170, cy = 170, R = 140, r = 96, b = [0, 30, 70, 110, 150, 180];
  const pt = (deg, rad) => [cx + rad * Math.sin(deg * Math.PI / 180), cy - rad * Math.cos(deg * Math.PI / 180)];
  let s = '';
  for (const side of [1, -1]) for (let i = 0; i < 5; i++) {
    const a0 = b[i] * side, a1 = b[i + 1] * side, sw = side > 0 ? 1 : 0;
    const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R), [x2, y2] = pt(a1, r), [x3, y3] = pt(a0, r);
    s += `<path d="M${x0},${y0} A${R},${R} 0 0,${sw} ${x1},${y1} L${x2},${y2} A${r},${r} 0 0,${1 - sw} ${x3},${y3} Z" fill="var(${i % 2 ? '--sec-b' : '--sec-a'})" stroke="var(--card)" stroke-width="3"/>`;
    const [tx, ty] = pt((a0 + a1) / 2, (R + r) / 2);
    s += `<text class="tn" x="${tx}" y="${ty + 8}" text-anchor="middle">${i + 1}</text>`;
  }
  for (const d of [0, 30, 70, 110, 150, 180, -30, -70, -110, -150]) {
    const [tx, ty] = pt(d, R + 16);
    s += `<text class="t" x="${tx}" y="${ty + 4}" text-anchor="middle">${Math.abs(d)}°</text>`;
  }
  s += `<path class="hull" d="M170,98 L184,124 L184,222 L178,236 L162,236 L156,222 L156,124 Z"/><rect x="160" y="208" width="20" height="14" fill="var(--hull-line)" opacity=".35"/>`;
  s += `<text class="t" x="170" y="91" text-anchor="middle">bow</text><text class="t" x="170" y="252" text-anchor="middle">stern</text>`;
  return `<svg viewBox="0 0 340 340" role="img" aria-label="Wave direction sectors relative to the bow">${s}</svg>`;
}

function renderItem(it) {
  switch (it.type) {
    case 'intro': return `
      <div class="card">
        <p class="q">We are interested in when you reduce speed in heavy weather, when you alter course, when you do both, and by how much.</p>
        <p class="hint">The questionnaire is <b>anonymous</b> and takes about 10 minutes. There are no right or wrong answers. We do not ask for your name or contact details, and stored responses contain no IP address. Your answers are kept in this browser until you submit, so you can come back later.</p>
        <p class="hint">Throughout the questionnaire, sea state and wave direction are given only as defined below.</p>
      </div>
      <div class="card">
        <p class="q">Wave direction relative to the bow</p>
        <p class="hint">0° = waves directly on the bow. Port and starboard sides are treated the same.</p>
        <div class="figwrap">${waveFigure()}
          <ul class="legend">${SECTORS.map((s, i) => `<li><b>${i + 1}</b>${s} <span class="hint">(${[0, 30, 70, 110, 150][i]}–${[30, 70, 110, 150, 180][i]}°)</span></li>`).join('')}</ul>
        </div>
      </div>
      <div class="card">
        <p class="q">Sea state (WMO)</p>
        <table class="g ss"><tr><th>Sea state</th><th>Description</th><th>Significant wave height Hs</th></tr>
        ${[['4', 'moderate', '1.25 – 2.5 m'], ['5', 'rough', '2.5 – 4 m'], ['6', 'very rough', '4 – 6 m'], ['7', 'high', '6 – 9 m'], ['8', 'very high', '9 – 14 m'], ['9', 'phenomenal', 'over 14 m']]
          .map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>Hs ${r[2]}</td></tr>`).join('')}
        </table>
        <p class="hint" style="margin-top:8px">Sea states 0 – 3 (Hs up to 1.25 m) are not considered.</p>
      </div>`;
    case 'radio': return `<p class="q">${esc(it.q)}</p>${it.hint ? `<p class="hint">${esc(it.hint)}</p>` : ''}${chips(it.key, it.opts)}` +
      (it.other ? `<div class="other" data-other-for="${it.key}"><input type="text" name="${it.other}" placeholder="please specify" aria-label="Other – please specify"></div>` : '');
    case 'fields': return `<p class="q">${esc(it.q)}</p>${it.hint ? `<p class="hint">${esc(it.hint)}</p>` : ''}<div class="fields">${it.fields.map(f => textInput(f.key, f.unit, f.label)).join('')}</div>`;
    case 'check': return `<label class="check"><input type="checkbox" name="${it.key}" value="yes"><span>${esc(it.label)}</span></label>`;
    case 'text': return `<p class="q">${esc(it.q)}</p><p class="hint">${esc(it.hint)}</p><textarea name="${it.key}" maxlength="4000"></textarea>`;
    case 'matrix': return `<p class="q">${esc(it.q)}</p><p class="hint">${esc(it.hint)}</p>` +
      (it.note ? `<div class="note">${it.note}</div>` : '') +
      (it.diagram ? `<div class="diag">${it.diagram}</div>` : '') +
      it.rows.map(r => `<div class="mrow"><div class="lbl">${esc(r.label)}</div>${chips(r.key, it.cols)}</div>`).join('');
    case 'grid21': return `<p class="q">2.1  What speed would you keep with the ship fully loaded?</p>
      <p class="hint">Write the speed you would deliberately keep (sectors 1, 3 and 5 only). If you think in rpm, write rpm instead and mark it here:</p>
      ${chips('q2_1_unit', [o('kn', 'I give knots (kn)'), o('rpm', 'I give rpm')])}
      <div style="overflow-x:auto;margin-top:12px"><table class="g"><tr><th>Sea state</th>${G21_COLS.map(c => `<th>${c[1]}</th>`).join('')}</tr>
      ${G21_ROWS.map(r => `<tr><td class="rl"><b>${r}</b><small>${SEA.find(s => s.v === r).sub}</small></td>${G21_COLS.map(c =>
        `<td><input type="text" inputmode="decimal" name="q2_1_ss${r}_${c[0]}" aria-label="sea state ${r}, ${c[1]}" autocomplete="off"></td>`).join('')}</tr>`).join('')}
      </table></div><p class="hint" style="margin-top:6px" id="g21unit"></p>`;
    case 'effects': return `<p class="q">The effects referred to in questions 2.2 – 2.4 and part 3</p>
      <ul class="legend">${EFFECTS.map((e, i) => `<li><b>${i + 1}</b>${e}</li>`).join('')}</ul>`;
    case 'effect35': return `<p class="q">3.5  When you act, what exactly do you do?</p>
      <p class="hint">For each effect: write the speed you settle at, and say what you do with the course.</p>
      <div class="note"><b>Waves after the alteration:</b> if you alter course because of that effect, choose the sector you try to have the waves coming from after the alteration.
      If you deal with that effect by reducing speed only and keep your course, choose <b>“course not altered (speed only)”</b>.</div>` +
      EFFECTS.map((e, i) => `<div class="mrow"><div class="lbl">${i + 1}  ${esc(e)}</div>
        <div class="fields" style="margin-bottom:10px">${textInput(`q3_5_e${i + 1}_speed_kn`, 'kn', 'Speed I settle at')}</div>
        <div class="hint" style="margin:0 0 6px">Waves after the alteration</div>
        ${chips(`q3_5_e${i + 1}_waves_after`, [o('no_course_change', 'course not altered', '(speed only)'), ...SECTOR_OPTS])}</div>`).join('');
    case 'submit': return `<p class="q">Ready to submit?</p><p class="hint" id="answeredInfo"></p>
      <button class="btn" id="submitBtn" type="button">Submit my answers</button><div class="msg" id="submitMsg" role="status"></div>`;
  }
  return '';
}

function renderPage() {
  const p = PAGES[page];
  let html = `<h2>${esc(p.title)}</h2>${p.lead ? `<p class="lead">${esc(p.lead)}</p>` : ''}`;
  let open = false;
  p.items.forEach((it, idx) => {
    const attrs = `data-idx="${idx}"`;
    if (it.type === 'intro') { html += renderItem(it); return; }
    if (it.sub && open) html += `<div class="sub" ${attrs}>${renderItem(it)}</div>`;
    else { if (open) html += `</div>`; html += `<div class="card" ${attrs}>${renderItem(it)}`; open = true; }
  });
  if (open) html += `</div>`;
  html += `<div class="nav">${page > 0 ? `<button class="btn ghost" type="button" id="back">Back</button>` : '<span></span>'}` +
    (page < PAGES.length - 1 ? `<button class="btn" type="button" id="next">${page === 0 ? 'Start' : 'Next'}</button>` : '') + `</div>`;
  app.innerHTML = html;

  app.querySelectorAll('input,textarea').forEach(el => {
    const v = A[el.name];
    if (el.type === 'radio') el.checked = v === el.value;
    else if (el.type === 'checkbox') el.checked = v === 'yes';
    else if (v != null) el.value = v;
  });
  const back = document.getElementById('back'), next = document.getElementById('next');
  if (back) back.onclick = () => go(page - 1);
  if (next) next.onclick = () => go(page + 1);
  const sb = document.getElementById('submitBtn');
  if (sb) sb.onclick = submit;
  refresh();

  document.getElementById('steps').innerHTML = PAGES.map((_, i) => `<i class="${i <= page ? 'on' : ''}"></i>`).join('');
  document.getElementById('stepLabel').textContent = page === 0 ? 'Anonymous questionnaire · about 10 minutes' : `Part ${page} of ${PAGES.length - 1}`;
}

function refresh() {
  const p = PAGES[page];
  p.items.forEach((it, idx) => {
    if (!it.showIf) return;
    const el = app.querySelector(`[data-idx="${idx}"]`);
    if (el) el.classList.toggle('hidden', !it.showIf(A));
  });
  app.querySelectorAll('[data-other-for]').forEach(el => el.classList.toggle('hidden', A[el.dataset.otherFor] !== 'other'));
  const u = document.getElementById('g21unit');
  if (u) u.textContent = A.q2_1_unit === 'rpm' ? 'Values in the table are rpm.' : 'Values in the table are knots.';
  const info = document.getElementById('answeredInfo');
  if (info) {
    const n = Object.keys(collect()).length;
    info.textContent = `You have answered ${n} item${n === 1 ? '' : 's'}. You can still go back and change anything. Unanswered questions are fine.`;
  }
}

/* Klik na već odabranu opciju je poništava */
let wasChecked = null;
app.addEventListener('pointerdown', e => {
  const lab = e.target.closest('label.chip');
  wasChecked = lab ? lab.querySelector('input').checked && lab.querySelector('input') : null;
});
app.addEventListener('click', e => {
  const lab = e.target.closest('label.chip');
  if (!lab || !wasChecked) return;
  const inp = lab.querySelector('input');
  if (inp === wasChecked) { e.preventDefault(); inp.checked = false; delete A[inp.name]; save(); refresh(); }
  wasChecked = null;
});
app.addEventListener('input', e => {
  const el = e.target;
  if (!el.name) return;
  if (el.type === 'checkbox') { if (el.checked) A[el.name] = 'yes'; else delete A[el.name]; }
  else if (el.value.trim() === '') delete A[el.name];
  else A[el.name] = el.type === 'radio' ? el.value : el.value.slice(0, 4000);
  save(); refresh();
});

function go(n) {
  page = Math.max(0, Math.min(PAGES.length - 1, n));
  renderPage();
  window.scrollTo({ top: 0 });
}

/* Samo vidljivi odgovori (npr. ako je odabrano "never", 2.2b se ne šalje) */
function collect() {
  const out = {};
  for (const p of PAGES) for (const it of p.items) {
    if (it.showIf && !it.showIf(A)) continue;
    for (const k of itemKeys(it)) {
      if (it.other && k === it.other && A[it.key] !== 'other') continue;
      if (A[k] != null && A[k] !== '') out[k] = String(A[k]).trim();
    }
  }
  return out;
}

async function rpc(fn, body) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST', signal: ctl.signal,
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const txt = await r.text();
    if (!r.ok) { let m = txt; try { m = JSON.parse(txt).message || txt; } catch (e) {} throw new Error(m); }
    return txt ? JSON.parse(txt) : null;
  } finally { clearTimeout(t); }
}

async function submit() {
  const btn = document.getElementById('submitBtn'), msg = document.getElementById('submitMsg');
  const answers = collect();
  if (!Object.keys(answers).length) { msg.className = 'msg err'; msg.textContent = 'You have not answered anything yet.'; return; }
  btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Sending…';
  try {
    if (DEMO) {
      const db = JSON.parse(store.get(DEMO_DB) || '[]');
      db.push({ id: db.length + 1, submitted_on: new Date().toISOString().slice(0, 10), survey_version: SURVEY_VERSION, answers });
      store.set(DEMO_DB, JSON.stringify(db));
    } else {
      await rpc('submit_survey', { p_answers: answers, p_version: SURVEY_VERSION });
    }
    store.del(DRAFT_KEY); A = {};
    store.set(SENT_KEY, '1');
    showDone();
  } catch (e) {
    btn.disabled = false; msg.className = 'msg err';
    msg.textContent = 'Could not send (' + (e.name === 'AbortError' ? 'no connection' : e.message) + '). Your answers are still saved in this browser – please try again when you have a connection.';
  }
}

function showDone() {
  document.getElementById('steps').innerHTML = PAGES.map(() => `<i class="on"></i>`).join('');
  document.getElementById('stepLabel').textContent = 'Submitted';
  app.innerHTML = `<div class="card done"><div class="big">⚓</div><h2>Thank you for your cooperation!</h2>
    <p class="lead">Your answers have been recorded anonymously.</p>
    <p class="hint">If someone else on board would like to take part, they can start a new questionnaire on this device.</p>
    <button class="btn ghost" type="button" id="again">Start a new questionnaire</button></div>`;
  document.getElementById('again').onclick = () => { page = 0; renderPage(); };
  window.scrollTo({ top: 0 });
}

/* ===================== ADMIN (#admin) – izvoz odgovora ===================== */
let ROWS = [];
function renderAdmin() {
  document.documentElement.lang = 'hr';
  document.title = 'Heavy Weather Survey – izvoz';
  document.getElementById('steps').innerHTML = '';
  document.getElementById('stepLabel').textContent = 'Administracija · izvoz odgovora';
  app.classList.add('admin');
  app.innerHTML = `<h2>Izvoz odgovora</h2>
    <div class="card"><p class="q">Lozinka za izvoz</p>
      <p class="hint">${DEMO ? 'Demo način: čitaju se odgovori spremljeni u ovom pregledniku, lozinka nije potrebna.' : 'Lozinku postavljaš u Supabaseu datotekom supabase-lozinka.sql.'}</p>
      <div class="uin" style="max-width:420px"><input type="text" id="pw" autocomplete="off" style="-webkit-text-security:disc" placeholder="lozinka"><button class="btn" id="load" type="button">Učitaj</button></div>
      <div class="msg" id="amsg" role="status"></div></div>
    <div id="res"></div>`;
  const load = async () => {
    const m = document.getElementById('amsg');
    m.className = 'msg'; m.textContent = 'Učitavam…';
    try {
      ROWS = DEMO ? JSON.parse(store.get(DEMO_DB) || '[]') : await rpc('export_survey', { p_password: document.getElementById('pw').value });
      m.textContent = ''; showRows();
    } catch (e) { m.className = 'msg err'; m.textContent = /unauthorized/.test(e.message) ? 'Pogrešna lozinka.' : 'Greška: ' + e.message; }
  };
  document.getElementById('load').onclick = load;
  document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') load(); };
}

function columns() {
  const extra = new Set();
  ROWS.forEach(r => Object.keys(r.answers || {}).forEach(k => { if (!ALL_KEYS.includes(k)) extra.add(k); }));
  return ['id', 'submitted_on', 'survey_version', ...ALL_KEYS, ...extra];
}
function cell(r, c) { return c in r && c !== 'answers' ? r[c] : (r.answers || {})[c]; }

function showRows() {
  const cols = columns();
  const last = ROWS.length ? ROWS[ROWS.length - 1].submitted_on : '–';
  const preview = cols.slice(0, 10);
  document.getElementById('res').innerHTML = `<div class="card">
    <div class="kpi"><div><b>${ROWS.length}</b>odgovora</div><div><b>${esc(last)}</b>zadnji odgovor</div><div><b>${cols.length}</b>stupaca</div></div>
    <div class="btnrow">
      <button class="btn" type="button" data-dl="semi">CSV za Excel (;)</button>
      <button class="btn ghost" type="button" data-dl="comma">CSV standardni (,)</button>
      <button class="btn ghost" type="button" data-dl="json">JSON</button>
      <button class="btn ghost" type="button" data-dl="codebook">Šifrarnik (CSV)</button>
    </div>
    <p class="hint" style="margin-top:10px">Jedan redak = jedan ispitanik, jedan stupac = jedno pitanje. Prazno polje = bez odgovora.</p>
    <div class="scroll"><table class="g"><tr>${preview.map(c => `<th>${esc(c)}</th>`).join('')}<th>…</th></tr>
      ${ROWS.slice(-10).reverse().map(r => `<tr>${preview.map(c => `<td>${esc(cell(r, c) ?? '')}</td>`).join('')}<td>…</td></tr>`).join('')}
    </table></div><p class="hint">Prikazano zadnjih ${Math.min(10, ROWS.length)} odgovora i prvih 10 stupaca.</p></div>`;
  document.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => download(b.dataset.dl));
}

function toCsv(rows, sep) {
  const q = v => { v = v == null ? '' : String(v); return /[",;\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return '﻿' + rows.map(r => r.map(q).join(sep)).join('\r\n');
}
function codebook() {
  const rows = [['column', 'question', 'values']];
  for (const p of PAGES) for (const it of p.items) {
    const keys = itemKeys(it);
    if (!keys.length) continue;
    if (it.type === 'radio') {
      rows.push([it.key, it.q, it.opts.map(x => `${x.v} = ${x.l}${x.sub ? ' (' + x.sub + ')' : ''}`).join(' | ')]);
      if (it.other) rows.push([it.other, it.q + ' – other (text)', 'free text']);
    } else if (it.type === 'matrix') it.rows.forEach(r => rows.push([r.key, it.q + ' – ' + r.label, it.cols.map(x => `${x.v} = ${x.l}${x.sub ? ' (' + x.sub + ')' : ''}`).join(' | ')]));
    else if (it.type === 'fields') it.fields.forEach(f => rows.push([f.key, it.q + ' – ' + f.label, 'number, ' + f.unit]));
    else if (it.type === 'grid21') {
      rows.push(['q2_1_unit', '2.1 unit of the values', 'kn | rpm']);
      G21_ROWS.forEach(r => G21_COLS.forEach(c => rows.push([`q2_1_ss${r}_${c[0]}`, `2.1 speed kept – sea state ${r}, ${c[1]}`, 'number (unit in q2_1_unit)'])));
    } else if (it.type === 'effect35') EFFECTS.forEach((e, i) => {
      rows.push([`q3_5_e${i + 1}_speed_kn`, `3.5 ${e} – speed I settle at`, 'number, kn']);
      rows.push([`q3_5_e${i + 1}_waves_after`, `3.5 ${e} – waves after the alteration`, 'no_course_change = course not altered (speed only) | ' + SECTOR_OPTS.map(x => `${x.v} = ${x.l}`).join(' | ')]);
    });
    else if (it.type === 'check') rows.push([it.key, it.label, 'yes | (empty)']);
    else if (it.type === 'text') rows.push([it.key, it.q, 'free text']);
  }
  return rows;
}
function download(kind) {
  const day = new Date().toISOString().slice(0, 10);
  let data, name, type = 'text/csv;charset=utf-8';
  if (kind === 'json') { data = JSON.stringify(ROWS, null, 2); name = `heavy-weather-${day}.json`; type = 'application/json'; }
  else if (kind === 'codebook') { data = toCsv(codebook(), ';'); name = `heavy-weather-sifrarnik.csv`; }
  else {
    const cols = columns();
    data = toCsv([cols, ...ROWS.map(r => cols.map(c => cell(r, c)))], kind === 'semi' ? ';' : ',');
    name = `heavy-weather-${day}${kind === 'semi' ? '-excel' : ''}.csv`;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ===== Start ===== */
if (DEMO) document.getElementById('demoBar').classList.remove('hidden');
if (location.hash === '#admin') renderAdmin();
else {
  if (Object.keys(A).length) page = 0;
  renderPage();
}
window.addEventListener('hashchange', () => location.reload());
</script>
